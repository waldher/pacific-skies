name: Graphics hill climb
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:land-worker
      - run: npm run test:scenery-reset
      - run: npm run graphics:capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-captures
          path: playtest/shots/graphics
          if-no-files-found: warn
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:graphics:unit
      - run: npm run graphics:gate
