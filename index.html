<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pacific Skies — 1942</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d2c40; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; -webkit-user-select:none; user-select:none; }
  #world { pointer-events:none; }
  #loading { position:fixed; inset:0; display:grid; place-content:center; padding:24px; text-align:center;
    background:#0d2c40; color:#f2e8c9; font:700 18px monospace; z-index:2; }
  #loading[hidden], #retry[hidden] { display:none; }
  #retry { justify-self:center; padding:10px 24px; font:inherit; cursor:pointer; }
  #flight-controls { position:fixed; right:18px; bottom:175px; display:flex; flex-direction:column; gap:8px; z-index:1; }
  #flight-controls[hidden], #flight-controls button[hidden] { display:none; }
  #flight-controls button { border:1px solid #83b5bc; background:#102f40e8; color:#f2e8c9; border-radius:7px;
    font:700 12px monospace; min-width:106px; min-height:44px; padding:10px; touch-action:manipulation; }
  #flight-controls button:disabled { opacity:.6; }
  :root { --panel:rgba(8,27,39,.88); --ink:#f2eee1; --muted:#adc6ca; --accent:#82dfbc; }
  .readout { color:var(--ink); font:500 13px/1.4 system-ui,sans-serif; pointer-events:none; user-select:none; }
  .readout [hidden], .readout[hidden] { display:none !important; }
  #flight-hud { position:fixed; inset:0; }
  #stats { box-sizing:border-box; position:absolute; top:12px; left:12px; width:176px; height:84px;
    background:linear-gradient(135deg,#132f3aee,#081b27ee); border:1px solid #adc6ca33; border-radius:12px; padding:8px 11px;
    box-shadow:inset 0 1px 0 #ffffff0c,0 3px 12px #00131d22; }
  .mission-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .eyebrow { font-size:8px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
  #score-value { display:block; font-size:23px; line-height:1.15; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .island-progress { text-align:right; }
  #islands-value { font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; color:var(--ink); }
  #island-pips { display:flex; justify-content:flex-end; gap:4px; margin-top:5px; }
  #island-pips i { width:7px; height:7px; border-radius:2px; background:#36505c; box-shadow:inset 0 0 0 1px #adc6ca33; }
  .gauges { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .gauge-heading { display:flex; justify-content:space-between; color:var(--muted); font-size:9px; margin-bottom:3px; line-height:1; }
  #hull-value { color:var(--accent); font-variant-numeric:tabular-nums; }
  .track { height:4px; background:#36505c; border-radius:3px; overflow:hidden; }
  .track i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  #objective, #toast { position:absolute; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 32px);
    box-sizing:border-box; text-align:center; background:var(--panel); border:1px solid #adc6ca26; border-radius:10px; padding:9px 14px; }
  #objective { top:108px; } #objective strong { display:block; font-weight:650; }
  #objective-detail { color:var(--muted); font-size:12px; }
  #capture-track { margin-top:7px; height:4px; }
  #toast { bottom:124px; font-size:12px; }
  #menu { position:fixed; inset:0; display:grid; place-items:center; padding:20px; box-sizing:border-box;
    background:radial-gradient(ellipse at center, #09232ddb, #061925ef); }
  #menu-card { width:min(100%,420px); text-align:center; }
  #menu-kicker { text-transform:uppercase; letter-spacing:.2em; color:var(--accent); font-size:11px; margin:0 0 12px; }
  #menu-title { font-size:clamp(26px,7vw,42px); letter-spacing:-.04em; line-height:1.05; margin:0 0 14px; font-weight:750; }
  #menu-summary { color:var(--muted); margin:0 auto 18px; max-width:32ch; font-size:14px; }
  #menu-instructions { display:grid; gap:7px; margin:0 auto 22px; width:max-content; max-width:100%; font-size:13px; }
  #menu-start { display:inline-block; margin:0; padding:11px 20px; border:1px solid #82dfbc77; border-radius:8px; color:var(--accent); font-weight:650; }
  #flight-controls button, #fire-indicator { box-sizing:border-box; width:112px; height:56px; min-width:112px; min-height:56px;
    padding:8px; font:650 12px/1.25 system-ui,sans-serif; border:1px solid #83b5bc; border-radius:14px;
    background:var(--panel); color:var(--ink); box-shadow:inset 0 1px 0 #ffffff0c; }
  #fire-indicator { position:fixed; right:18px; bottom:56px; display:grid; place-content:center; pointer-events:none; }
  #fire-indicator[data-firing="true"] { background:#953f34db; border-color:#f0a18d; }
  @media(max-height:450px) { #menu { padding:12px; } #menu-kicker { margin-bottom:7px; } #menu-title { font-size:28px; margin-bottom:10px; } #menu-summary { margin-bottom:10px; } #menu-instructions { gap:3px; margin-bottom:12px; } #objective { top:104px; padding:6px 12px; } #toast { bottom:14px; } }
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<canvas id="c" aria-label="Pacific Skies game and controls"></canvas>
<div id="flight-hud" class="readout" hidden>
  <div id="stats">
    <div class="mission-row"><div><div class="eyebrow">Score</div><strong id="score-value">0</strong></div>
      <div class="island-progress"><div class="eyebrow">Islands <span id="islands-value">0 / 4</span></div><div id="island-pips" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div></div>
    <div class="gauges"><div><div class="gauge-heading"><span>Hull</span><span id="hull-value">100%</span></div><div class="track"><i id="health-fill"></i></div></div>
      <div><div class="gauge-heading"><span>Gun heat</span></div><div class="track"><i id="heat-fill"></i></div></div></div>
  </div>
  <div id="objective" hidden><strong id="objective-title"></strong><span id="objective-detail"></span><div id="capture-track" class="track" hidden><i id="capture-fill"></i></div></div>
  <div id="toast" hidden></div>
</div>
<div id="menu" class="readout" hidden><div id="menu-card"><p id="menu-kicker"></p><h1 id="menu-title"></h1><p id="menu-summary"></p><div id="menu-instructions"></div><p id="menu-start"></p></div></div>
<div id="flight-controls" hidden><button id="torpedo-action">TORPEDO</button><button id="carrier-action">CARRIER</button></div>
<div id="fire-indicator" class="readout" hidden>Fire</div>
<div id="loading" role="status"><p id="loading-text">Loading aircraft…</p><button id="retry" hidden>Retry</button></div>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
